<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BILIM KIDS — bolalar uchun taʼlim platformasi</title>
<style>
:root{--bg:#f6f8ff;--c:#fff;--t:#1f2547;--m:#4a5070;--b:#2f6be0;--p:#6d3fe0;--g:#0f7f5c;--l:#e3e8fb;--on:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#12162b;--c:#1c2140;--t:#eef0ff;--m:#b9bfdc;--b:#7aa5ff;--p:#a98bff;--g:#43d3a0;--l:#2d3358;--on:#10143a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--c);position:sticky;top:0;z-index:5;box-shadow:0 4px 18px rgba(79,100,255,.12)}
.logo{font-weight:800;font-size:1.25rem;color:var(--p);text-decoration:none}
nav{display:flex;gap:6px;flex-wrap:wrap}
a{color:var(--b)}
.btn,nav a,nav button{min-height:44px;padding:10px 16px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;background:var(--b);color:var(--on)}
nav a{background:none;color:var(--t)}
.btn.g{background:var(--g)}.btn.x{background:var(--l);color:var(--t)}
:is(button,a,input,select):focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 24px rgba(79,100,255,.1)}
input,select{width:100%;min-height:44px;padding:10px;margin:4px 0 10px;border-radius:12px;border:2px solid var(--l);background:var(--bg);color:var(--t);font:inherit}
label{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:#c0262d;font-weight:600;min-height:1.4em}
.tag{background:var(--l);padding:2px 10px;border-radius:99px;font-size:.85rem}
.bar{height:10px;border-radius:6px;background:var(--l);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--p))}
h1{color:var(--p);line-height:1.2}.hero h1{font-size:clamp(2rem,7vw,3rem)}
.cm{background:var(--bg);border-radius:12px;padding:8px 12px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--t);color:var(--bg);padding:12px 20px;border-radius:14px;z-index:20;max-width:90%}
</style>
</head>
<body>
<header><a class="logo" href="#home">🧠 BILIM KIDS</a><nav id="nav" aria-label="Asosiy"></nav></header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ===== Supabase ulanishi =====
   Publishable kalit ochiq bo'lishi mumkin: xavfsizlikni bazadagi RLS qoidalari ta'minlaydi.
   SECRET kalitni bu faylga HECH QACHON yozmang. */
const SB=supabase.createClient("https://cvyqslqdcukubjmxrrlp.supabase.co","sb_publishable_uRuPNj0ttsjIkSnWY4_9Tg_KSG8nWO_");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const go=h=>location.hash==="#"+h?render():(location.hash=h);
const toast=m=>{const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)};
const err=m=>{const e=$(".err");if(e)e.textContent=m};
const run=async(p,ok)=>{const{error}=await p;if(error){toast("Xato: "+error.message);return false}if(ok)toast(ok);return true};
const SUBJ={colors:"Ranglar",numbers:"Raqamlar",letters:"Harflar",shapes:"Shakllar"};
const bar=(l,v)=>`<div>${esc(l)}: ${+v||0}%</div><div class="bar"><i style="width:${+v||0}%"></i></div>`;

/* ===== Joriy foydalanuvchi (rol serverdagi profiles jadvalidan olinadi) ===== */
let ME=null;
async function loadMe(){
 const{data:{session}}=await SB.auth.getSession();
 if(!session){ME=null;return}
 const{data}=await SB.from("profiles").select("role,is_helper,full_name").eq("id",session.user.id).single();
 ME=data?{id:session.user.id,email:session.user.email,...data}:null;
}
const mod=()=>!!ME&&(ME.role==="admin"||ME.is_helper);

/* ===== Sahifalar ===== */
const pHome=async()=>`<section class="hero"><h1>BILIM KIDS</h1><h2>Bolaning bugungi rivoji — ertangi muvaffaqiyati!</h2>
<p>3–7 yoshli bolalar uchun bogʻcha platformasi: davomat, tarbiyachi izohlari, rivojlanish va video darslar bir joyda.</p>
<p class="row">${ME?`<a class="btn" href="#panel">Panelga oʻtish</a>`:`<a class="btn" href="#login">Kirish</a><a class="btn x" href="#register">Roʻyxatdan oʻtish</a>`}<a class="btn x" href="#videos">Video darslar</a></p></section>`;

const pLogin=async()=>`<form class="card" data-f="login" style="max-width:420px;margin:24px auto"><h1>Kirish</h1>
<label for="e">Email</label><input id="e" name="e" type="email" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<label for="p">Parol</label><input id="p" name="p" type="password" required autocomplete="current-password">
<label class="row" style="font-weight:400"><input type="checkbox" data-a="pwv" style="width:22px;min-height:22px"> Parolni koʻrsatish</label>
<p class="err" role="alert"></p><button class="btn">Kirish</button>
<p><a href="#forgot">Parolni unutdingizmi?</a></p>
<p>Hisobingiz yoʻqmi? <a href="#register">Roʻyxatdan oʻting</a></p></form>`;

const pReg=async()=>`<form class="card" data-f="reg" style="max-width:420px;margin:24px auto"><h1>Roʻyxatdan oʻtish</h1>
<label for="fn">Ismingiz</label><input id="fn" name="fn" required minlength="2" maxlength="60" autocomplete="name">
<label for="e">Email</label><input id="e" name="e" type="email" required autocomplete="username">
<label for="r">Siz kimsiz?</label><select id="r" name="r"><option value="parent">Ota-ona</option><option value="teacher">Tarbiyachi</option></select>
<label for="p">Parol (kamida 8 belgi)</label><input id="p" name="p" type="password" required minlength="8" autocomplete="new-password">
<label class="row" style="font-weight:400"><input type="checkbox" data-a="pwv" style="width:22px;min-height:22px"> Parolni koʻrsatish</label>
<p class="err" role="alert"></p><button class="btn">Roʻyxatdan oʻtish</button>
<p>Hisobingiz bormi? <a href="#login">Kirish</a></p>
<p style="color:var(--m);font-size:.9rem">Administrator hisobi oʻzi yaratilmaydi. Tarbiyachi va ota-onani administrator guruh va farzandga bogʻlaydi.</p></form>`;

const pForgot=async()=>`<form class="card" data-f="forgot" style="max-width:420px;margin:24px auto"><h1>Parolni tiklash</h1>
<p>Email manzilingizni yozing. Parolni yangilash havolasi yuboriladi.</p>
<label for="e">Email</label><input id="e" name="e" type="email" required autocomplete="username">
<p class="err" role="alert"></p><button class="btn">Havola yuborish</button>
<p><a href="#login">← Kirishga qaytish</a></p></form>`;
const pNewPass=async()=>!ME?'<div class="card"><p>Havola eskirgan yoki notoʻgʻri. <a href="#forgot">Qayta yuboring</a>.</p></div>'
:`<form class="card" data-f="newpass" style="max-width:420px;margin:24px auto"><h1>Yangi parol</h1>
<label for="p">Yangi parol (kamida 8 belgi)</label><input id="p" name="p" type="password" required minlength="8" autocomplete="new-password">
<p class="err" role="alert"></p><button class="btn">Saqlash</button></form>`;

async function pPanel(){
 if(!ME){location.hash="login";return ""}
 return ME.role==="admin"?pAdmin():ME.role==="teacher"?pTeacher():pParent();
}

async function pAdmin(){
 const q=t=>SB.from(t).select("*");
 const[g,c,p,r]=await Promise.all([q("groups"),q("children"),SB.from("profiles").select("id,full_name,role"),SB.from("admin_requests").select("id,user_id").eq("status","wait")]);
 const P=p.data||[],G=g.data||[],C=c.data||[],nm=id=>esc((P.find(x=>x.id===id)||{}).full_name||"—");
 const opt=(a,f)=>a.map(x=>`<option value="${x.id}">${esc(f(x))}</option>`).join("");
 const nmf=x=>x.full_name||x.id.slice(0,6);
 return `<h1>Administrator paneli</h1>
<div class="card"><h2>Yangi guruh</h2><form data-f="grp"><input name="n" placeholder="Guruh nomi" required minlength="2" maxlength="40"><input name="a" placeholder="Yosh (masalan: 4–5 yosh)"><select name="t"><option value="">Tarbiyachi tanlang</option>${opt(P.filter(x=>x.role==="teacher"),nmf)}</select><button class="btn">Qoʻshish</button></form></div>
<div class="card"><h2>Yangi bola</h2><form data-f="kid"><input name="n" placeholder="Bolaning ismi" required maxlength="40"><select name="g"><option value="">Guruh tanlang</option>${opt(G,x=>x.name)}</select><select name="p"><option value="">Ota-onani tanlang</option>${opt(P.filter(x=>x.role==="parent"),nmf)}</select><button class="btn">Qoʻshish</button></form></div>
<div class="card"><h2>Guruhlar (${G.length})</h2>${G.map(x=>`<p>${esc(x.name)} · ${esc(x.age_range)} · ${nm(x.teacher_id)}</p>`).join("")||"<p>Hali yoʻq.</p>"}</div>
<div class="card"><h2>Bolalar (${C.length})</h2>${C.map(x=>`<p>${esc(x.name)} · ${esc((G.find(y=>y.id===x.group_id)||{}).name||"guruhsiz")} · ota-ona: ${nm(x.parent_id)}</p>`).join("")||"<p>Hali yoʻq.</p>"}</div>
<div class="card"><h2>Admin boʻlish soʻrovlari</h2>${(r.data||[]).map(x=>`<p class="row">${nm(x.user_id)} <button class="btn g" data-a="dec" data-v="${x.id}:1">Rozi</button><button class="btn x" data-a="dec" data-v="${x.id}:0">Rad etish</button></p>`).join("")||"<p>Yangi soʻrov yoʻq.</p>"}</div>`;
}

async function pTeacher(){
 const[g,c,a]=await Promise.all([SB.from("groups").select("name"),SB.from("children").select("*"),SB.from("attendance").select("child_id,status").eq("day",today())]);
 const A=Object.fromEntries((a.data||[]).map(x=>[x.child_id,x.status])),C=c.data||[];
 const st=s=>s==="p"?'<span class="tag">✅ Keldi</span>':s==="a"?'<span class="tag">❌ Kelmadi</span>':'<span class="tag">belgilanmagan</span>';
 return `<h1>Tarbiyachi paneli</h1><p>${(g.data||[]).map(x=>"Guruh: "+esc(x.name)).join(", ")||"Sizga hali guruh biriktirilmagan. Administratorga murojaat qiling."} · ${today()}</p>
${C.map(x=>`<div class="card"><b>${esc(x.name)}</b> ${st(A[x.id])}
<p class="row"><button class="btn g" data-a="mark" data-v="${x.id}:p">Keldi</button><button class="btn x" data-a="mark" data-v="${x.id}:a">Kelmadi</button></p>
<form data-f="note" data-v="${x.id}" class="row"><input name="x" value="${esc(x.note)}" maxlength="300" placeholder="Izoh yozing" aria-label="Izoh" style="flex:1;min-width:180px;margin:0"><button class="btn">Saqlash</button></form></div>`).join("")}`;
}

async function pParent(){
 const[c,g,a]=await Promise.all([SB.from("children").select("*"),SB.from("groups").select("id,name"),SB.from("attendance").select("child_id,day,status").order("day",{ascending:false}).limit(14)]);
 const C=c.data||[];
 return `<h1>Ota-ona paneli</h1>${C.map(x=>`<div class="card"><h2>👶 ${esc(x.name)}</h2><p>Guruh: ${esc(((g.data||[]).find(y=>y.id===x.group_id)||{}).name||"—")}</p>
${Object.entries(SUBJ).map(([k,l])=>bar(l,(x.progress||{})[k])).join("")}
<p><b>Tarbiyachi izohi:</b> ${esc(x.note)||"—"}</p>
<p><b>Davomat (oxirgi kunlar):</b><br>${(a.data||[]).filter(y=>y.child_id===x.id).map(y=>`${esc(y.day)} ${y.status==="p"?"✅":"❌"}`).join(" · ")||"Maʼlumot yoʻq."}</p></div>`).join("")||"<p>Sizga hali farzand biriktirilmagan. Administratorga murojaat qiling.</p>"}`;
}

async function pVideos(){
 const[v,c,r]=await Promise.all([SB.from("videos").select("*").order("created_at",{ascending:false}),SB.from("comments").select("*").order("created_at"),
  ME&&!mod()?SB.from("admin_requests").select("status").order("created_at",{ascending:false}).limit(1):Promise.resolve({data:[]})]);
 const st=(r.data&&r.data[0]||{}).status;
 return `<h1>Video darslar va fikrlar</h1>
${ME&&!mod()?`<div class="card"><h2>Video qoʻshish huquqi</h2>${st==="wait"?"<p>⏳ Soʻrovingiz koʻrib chiqilmoqda.</p>":`<p>Video qoʻshish uchun bosh administratordan ruxsat soʻrashingiz mumkin.</p><button class="btn x" data-a="rq">Soʻrov yuborish</button>`}</div>`:""}
${mod()?`<form class="card" data-f="vid"><h2>Yangi video</h2><input name="t" placeholder="Sarlavha" required minlength="3" maxlength="80"><input name="u" type="url" placeholder="https://www.youtube.com/watch?v=…" required pattern="https://.*"><input name="d" placeholder="Tavsif" maxlength="200"><button class="btn g">Qoʻshish</button></form>`:""}
${(v.data||[]).map(x=>{const cs=(c.data||[]).filter(y=>y.video_id===x.id);return `<article class="card"><h2>▶ ${esc(x.title)}</h2><p>${esc(x.description)}</p>
<p class="row"><a class="btn" href="${/^https:\/\//.test(x.url)?esc(x.url):"#"}" target="_blank" rel="noopener noreferrer">Videoni ochish ↗</a>${mod()?`<button class="btn x" data-a="delv" data-v="${x.id}">Oʻchirish</button>`:""}</p>
<h3>Fikrlar (${cs.length})</h3>${cs.map(y=>`<p class="cm"><b>${esc(y.author_name)}</b> <span class="tag">${esc(y.author_role)}</span><br>${esc(y.body)}${mod()||y.author_id===(ME&&ME.id)?` <button class="btn x" data-a="delc" data-v="${y.id}" aria-label="Fikrni oʻchirish">×</button>`:""}</p>`).join("")}
${ME?`<form data-f="cm" data-v="${x.id}" class="row"><input name="x" required minlength="2" maxlength="300" placeholder="Fikringizni yozing…" aria-label="Fikr" style="flex:1;min-width:180px;margin:0"><button class="btn">Yuborish</button></form>`:`<p><a href="#login">Fikr yozish uchun kiring</a></p>`}</article>`}).join("")||'<p class="card">Hozircha video yoʻq.</p>'}`;
}

/* ===== Router ===== */
const nav=()=>{$("#nav").innerHTML=ME?`<a href="#videos">Videolar</a><a href="#panel">Panel</a><button data-a="out">Chiqish</button>`:`<a href="#videos">Videolar</a><a href="#login">Kirish</a><a href="#register">Roʻyxatdan oʻtish</a>`};
async function render(){
 await loadMe();nav();
 const h=location.hash.slice(1)||"home",R={home:pHome,login:pLogin,register:pReg,forgot:pForgot,newpass:pNewPass,videos:pVideos,panel:pPanel};
 if(ME&&["login","register","forgot"].includes(h))return go("panel");
 try{$("#app").innerHTML=await(R[h]||pHome)()}catch(e){$("#app").innerHTML=`<p class="err">Xato: ${esc(e.message)}</p>`}
 window.scrollTo(0,0);
}

/* ===== Formalar va tugmalar ===== */
const F={
 async login(f){const{error}=await SB.auth.signInWithPassword({email:f.e.value.trim().toLowerCase(),password:f.p.value});if(error)return err(/confirm/i.test(error.message)?"Email hali tasdiqlanmagan. Pochtangizdagi xatni tekshiring.":"Email yoki parol notoʻgʻri. Parolni unutgan boʻlsangiz, \"Parolni unutdingizmi?\" havolasidan tiklang.");await loadMe();if(!ME)return err("Kirdingiz, lekin profil topilmadi. Administratorga murojaat qiling.");go("panel")},
 async forgot(f){
  const{error}=await SB.auth.resetPasswordForEmail(f.e.value.trim(),{redirectTo:location.origin+location.pathname});
  if(error)return err(error.message);
  f.innerHTML='<h1>Xat yuborildi 📧</h1><p>Agar bu email roʻyxatdan oʻtgan boʻlsa, parolni yangilash havolasi yuborildi. Spam papkasini ham tekshiring.</p><p><a href="#login">Kirish</a></p>'},
 async newpass(f){const{error}=await SB.auth.updateUser({password:f.p.value});if(error)return err(error.message);toast("Parol yangilandi ✓");go("panel")},
 async reg(f){
  const{data,error}=await SB.auth.signUp({email:f.e.value.trim(),password:f.p.value,options:{data:{full_name:f.fn.value.trim(),role:f.r.value}}});
  if(error)return err(error.message);
  if(!data.session){$("#app").innerHTML='<div class="card"><h2>Emailingizni tekshiring 📧</h2><p>Tasdiqlash xati yuborildi. Havolani bosgach, <a href="#login">kiring</a>.</p></div>';return}
  go("panel")},
 async grp(f){if(await run(SB.from("groups").insert({name:f.n.value.trim(),age_range:f.a.value.trim(),teacher_id:f.t.value||null}),"Guruh qoʻshildi ✓"))render()},
 async kid(f){if(await run(SB.from("children").insert({name:f.n.value.trim(),group_id:f.g.value||null,parent_id:f.p.value||null}),"Bola qoʻshildi ✓"))render()},
 async note(f){await run(SB.from("children").update({note:f.x.value.trim()}).eq("id",f.dataset.v),"Izoh saqlandi ✓")},
 async vid(f){if(await run(SB.from("videos").insert({title:f.t.value.trim(),url:f.u.value.trim(),description:f.d.value.trim()}),"Video qoʻshildi ✓"))render()},
 async cm(f){if(await run(SB.from("comments").insert({video_id:f.dataset.v,body:f.x.value.trim()}),"Fikr yuborildi ✓"))render()}
};
const ACT={
 async out(){await SB.auth.signOut();go("home")},
 pwv(_,b){b.form.querySelectorAll("[name=p]").forEach(i=>i.type=b.checked?"text":"password")},
 async mark(v){const[id,s]=v.split(":");if(await run(SB.from("attendance").upsert({child_id:id,day:today(),status:s},{onConflict:"child_id,day"}),"Davomat saqlandi ✓"))render()},
 async dec(v){const[id,ok]=v.split(":");if(await run(SB.rpc("decide_request",{req:id,approve:ok==="1"}),"Bajarildi ✓"))render()},
 async rq(){if(await run(SB.from("admin_requests").insert({}),"Soʻrov yuborildi ✓"))render()},
 async delv(id){if(await run(SB.from("videos").delete().eq("id",id),"Video oʻchirildi"))render()},
 async delc(id){if(await run(SB.from("comments").delete().eq("id",id),"Fikr oʻchirildi"))render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset.v,b)});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;F[f.dataset.f]&&F[f.dataset.f](f)});
addEventListener("hashchange",render);
SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")setTimeout(()=>go("newpass"),0)});
render();
</script>
</body>
</html>
